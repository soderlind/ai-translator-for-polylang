name: Manually Build release zip

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        type: string
        default: ''

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Stage release files
        run: |
          mkdir -p /tmp/ai-translator-for-polylang
          rsync -a --exclude='.git/' --exclude-from='.distignore' . /tmp/ai-translator-for-polylang/

      - name: Archive release
        working-directory: /tmp
        run: zip -r ${{ github.workspace }}/ai-translator-for-polylang.zip ai-translator-for-polylang/

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" ai-translator-for-polylang.zip --clobber
          else
            gh release create "$TAG" ai-translator-for-polylang.zip --title "$TAG" --generate-notes
          fi
